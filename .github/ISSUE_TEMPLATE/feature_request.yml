name: Feature request
description: Suggest an idea or enhancement for Scriben
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the feature and why it would be useful.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this feature solve, or what workflow is missing today?
      placeholder: It would be great if Scriben could...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see and how you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, sketches, or links that help illustrate the request.
  - type: checkboxes
    id: checklist
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this feature and open a pull request.
        - label: I have read the README and searched existing issues for similar requests.